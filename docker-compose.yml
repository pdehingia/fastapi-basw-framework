version: '3.8'

services:
  # ==========================================
  # Backend API Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monorepo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:delegated
      - ./backend/alembic:/app/alembic:delegated
      - ./backend/alembic.ini:/app/alembic.ini:delegated
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: monorepo_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MongoDB Database
  # ==========================================
  mongodb:
    image: mongo:7-jammy
    container_name: monorepo_mongodb
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongodb.js:/docker-entrypoint-initdb.d/init-mongodb.js
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: monorepo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Adminer Database Management (PostgreSQL)
  # ==========================================
  adminer:
    image: adminer:4.8.1
    container_name: monorepo_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    networks:
      - app_network

  # ==========================================
  # MongoDB Express (MongoDB Management)
  # ==========================================
  mongo_express:
    image: mongo-express:1.0.2
    container_name: monorepo_mongo_express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_PASSWORD}
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    networks:
      - app_network

  # ==========================================
  # Admin Dashboard (Frontend)
  # ==========================================
  # Uncomment when admin app is ready
  # admin:
  #   build:
  #     context: ./admin
  #     dockerfile: Dockerfile
  #   container_name: monorepo_admin
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000
  #     - NODE_ENV=development
  #   volumes:
  #     - ./admin:/app:delegated
  #     - /app/node_modules
  #   networks:
  #     - app_network
  #   depends_on:
  #     - backend

  # ==========================================
  # Provider Application (Frontend)
  # ==========================================
  # Uncomment when provider app is ready
  # provider:
  #   build:
  #     context: ./provider
  #     dockerfile: Dockerfile
  #   container_name: monorepo_provider
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000
  #     - NODE_ENV=development
  #   volumes:
  #     - ./provider:/app:delegated
  #     - /app/node_modules
  #   networks:
  #     - app_network
  #   depends_on:
  #     - backend

  # ==========================================
  # Web Application (Frontend)
  # ==========================================
  # Uncomment when web app is ready
  # web:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile
  #   container_name: monorepo_web
  #   restart: unless-stopped
  #   ports:
  #     - "3002:3000"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000
  #     - NODE_ENV=development
  #   volumes:
  #     - ./web:/app:delegated
  #     - /app/node_modules
  #   networks:
  #     - app_network
  #   depends_on:
  #     - backend

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  app_network:
    driver: bridge
    name: monorepo_network
